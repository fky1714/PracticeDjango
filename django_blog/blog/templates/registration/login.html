{% extends "blog/base.html" %}

{% block title %}ログイン | Djangoブログ{% endblock %}

{% block content %}
<h2>ログイン</h2>

{% if form.errors %}
  <p style="color: red;">ユーザー名またはパスワードが正しくありません。</p>
{% endif %}

<form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">ログイン</button>
</form>

<p class="mt-3">アカウントをお持ちでないですか？ <a href="{% url 'blog:signup' %}">こちらからサインアップ</a></p>
{% endblock %}
